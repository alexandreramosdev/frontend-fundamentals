<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Exemplo de Tabelas</title>
  </head>
  <body>
    <h1>Exemplo de Tabelas em HTML</h1>

    <table>
      <caption>Lista de Alunos e Notas</caption>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Disciplina</th>
          <th>Nota</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ana Silva</td>
          <td>Matemática</td>
          <td>8.5</td>
          <td class="aprovado">Aprovado</td>
        </tr>
        <tr>
          <td>Carlos Souza</td>
          <td>História</td>
          <td>5.0</td>
          <td class="recuperacao">Recuperação</td>
        </tr>
        <tr>
          <td>Mariana Costa</td>
          <td>Física</td>
          <td>9.2</td>
          <td class="aprovado">Aprovado</td>
        </tr>
        <tr>
          <td>João Pedro</td>
          <td>Química</td>
          <td>4.0</td>
          <td class="reprovado">Reprovado</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">Média Geral da Turma</td>
          <td colspan="2">6.67</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
